# ============================================================================
# Auto-Update Formula
# ============================================================================
# Triggered by eeroctl release workflow
# Auto-commits updated formula to master branch
# ============================================================================

name: Update Formula

on:
  repository_dispatch:
    types: [update-formula]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to update to"
        required: true

permissions:
  contents: write

jobs:
  update:
    name: Update eeroctl Formula
    runs-on: macos-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install tools
        run: pip install homebrew-pypi-poet

      - name: Get package metadata
        id: meta
        env:
          VERSION: ${{ github.event.client_payload.version || github.event.inputs.version }}
        run: |
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

          # Fetch metadata from PyPI
          PYPI_JSON=$(curl -s "https://pypi.org/pypi/eeroctl/${VERSION}/json")

          # Extract SHA256 and URL for sdist
          SHA256=$(echo "$PYPI_JSON" | python3 -c "
import sys, json
data = json.load(sys.stdin)
for url in data['urls']:
    if url['packagetype'] == 'sdist':
        print(url['digests']['sha256'])
        break
")
          echo "sha256=${SHA256}" >> $GITHUB_OUTPUT

          SOURCE_URL=$(echo "$PYPI_JSON" | python3 -c "
import sys, json
data = json.load(sys.stdin)
for url in data['urls']:
    if url['packagetype'] == 'sdist':
        print(url['url'])
        break
")
          echo "source_url=${SOURCE_URL}" >> $GITHUB_OUTPUT

          echo "Package: eeroctl"
          echo "Version: ${VERSION}"
          echo "URL: ${SOURCE_URL}"
          echo "SHA256: ${SHA256}"

      - name: Generate resource stanzas
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          # Install package to resolve dependencies
          pip install eeroctl==${VERSION}

          # Generate resource stanzas with poet
          poet -r eeroctl > /tmp/resources.rb

          echo "Generated resources:"
          cat /tmp/resources.rb

      - name: Update formula
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          SHA256: ${{ steps.meta.outputs.sha256 }}
          SOURCE_URL: ${{ steps.meta.outputs.source_url }}
        run: |
          # Read resources and escape for sed
          RESOURCES=$(cat /tmp/resources.rb)

          # Generate formula without indentation issues
          cat > Formula/eeroctl.rb << 'FORMULA_END'
 class Eeroctl < Formula
   include Language::Python::Virtualenv

   desc "Command-line interface for managing Eero mesh Wi-Fi networks"
   homepage "https://github.com/fulviofreitas/eeroctl"
FORMULA_END

          # Append dynamic parts
          echo "  url \"${SOURCE_URL}\"" >> Formula/eeroctl.rb
          echo "  sha256 \"${SHA256}\"" >> Formula/eeroctl.rb

          cat >> Formula/eeroctl.rb << 'FORMULA_END'
   license "MIT"
   head "https://github.com/fulviofreitas/eeroctl.git", branch: "master"

   depends_on "python@3.12"

FORMULA_END

          # Append resources
          cat /tmp/resources.rb >> Formula/eeroctl.rb

          cat >> Formula/eeroctl.rb << 'FORMULA_END'

   def install
     virtualenv_install_with_resources
   end

   test do
     assert_match version.to_s, shell_output("#{bin}/eero --version")
     assert_match "Usage:", shell_output("#{bin}/eero --help")
   end
 end
FORMULA_END

          # Fix indentation (remove leading space)
          sed -i '' 's/^ //' Formula/eeroctl.rb

          echo "Generated formula:"
          cat Formula/eeroctl.rb

      - name: Validate formula
        run: |
          echo "Installing from source..."
          brew install --build-from-source ./Formula/eeroctl.rb

          echo "Checking version..."
          eero --version

          echo "Checking help..."
          eero --help | head -5

          echo "Validation passed"

      - name: Commit and push
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add Formula/eeroctl.rb
          git commit -m "chore: update eeroctl to v${VERSION}"
          git push

          echo "Formula committed and pushed"

      - name: Summary
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          cat >> $GITHUB_STEP_SUMMARY << EOF
          ## Homebrew Formula Updated

          | Property | Value |
          |:---------|:------|
          | Package | \`eeroctl\` |
          | Version | \`v${VERSION}\` |
          | Validated | Build from source passed |
          | Committed | Auto-merged to master |

          ### Installation

          \`\`\`bash
          brew install fulviofreitas/eeroctl/eeroctl
          \`\`\`

          ### Upgrade

          \`\`\`bash
          brew upgrade eeroctl
          \`\`\`
          EOF
