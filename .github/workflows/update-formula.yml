# ============================================================================
# 🍺 Auto-Update Homebrew Formula
# ============================================================================
# Triggered by eeroctl release workflow
# Auto-commits updated formula to master branch
# ============================================================================

name: 🍺 Update Formula

on:
  repository_dispatch:
    types: [update-formula]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to update to (number only, e.g., 1.8.0, not v1.8.0)"
        required: true

permissions:
  contents: write
  pull-requests: write

# Prevent concurrent runs from conflicting
concurrency:
  group: formula-update
  cancel-in-progress: false

jobs:
  # ===========================================================================
  # Job 1: Generate formula on fast Ubuntu runner
  # ===========================================================================
  generate:
    name: 📝 Generate Formula
    runs-on: ubuntu-latest
    timeout-minutes: 15

    outputs:
      version: ${{ steps.meta.outputs.version }}
      sha256: ${{ steps.meta.outputs.sha256 }}
      source_url: ${{ steps.meta.outputs.source_url }}

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v6

      - name: 🐍 Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: ⏳ Wait for PyPI availability
        uses: fulviofreitas/workflow-arsenal/.github/actions/wait-for-pypi@master
        with:
          package: eeroctl
          version: ${{ github.event.client_payload.version || github.event.inputs.version }}
          fail-on-timeout: "true"

      - name: 📋 Get package metadata
        id: meta
        env:
          VERSION: ${{ github.event.client_payload.version || github.event.inputs.version }}
        run: |
          echo "🔍 Fetching metadata from PyPI..."
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

          PYPI_JSON=$(curl -s "https://pypi.org/pypi/eeroctl/${VERSION}/json")

          SHA256=$(echo "$PYPI_JSON" | python3 -c "import sys, json; data = json.load(sys.stdin); print(next(u['digests']['sha256'] for u in data['urls'] if u['packagetype'] == 'sdist'))")
          echo "sha256=${SHA256}" >> $GITHUB_OUTPUT

          SOURCE_URL=$(echo "$PYPI_JSON" | python3 -c "import sys, json; data = json.load(sys.stdin); print(next(u['url'] for u in data['urls'] if u['packagetype'] == 'sdist'))")
          echo "source_url=${SOURCE_URL}" >> $GITHUB_OUTPUT

          echo ""
          echo "📦 Package: eeroctl"
          echo "🏷️  Version: ${VERSION}"
          echo "🔗 URL: ${SOURCE_URL}"
          echo "🔐 SHA256: ${SHA256}"

      - name: 🏗️ Build formula
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          SHA256: ${{ steps.meta.outputs.sha256 }}
          SOURCE_URL: ${{ steps.meta.outputs.source_url }}
        run: |
          echo "🏗️ Building Formula/eeroctl.rb..."

          # Generate formula that uses post_install for pip packages
          # This bypasses Homebrew's dylib ID rewriting which fails on pydantic_core
          cat > Formula/eeroctl.rb << 'FORMULA_EOF'
          class Eeroctl < Formula
            include Language::Python::Virtualenv

            desc "Command-line interface for managing Eero mesh Wi-Fi networks"
            homepage "https://github.com/fulviofreitas/eeroctl"
          FORMULA_EOF

          echo "  url \"${SOURCE_URL}\"" >> Formula/eeroctl.rb
          echo "  sha256 \"${SHA256}\"" >> Formula/eeroctl.rb

          cat >> Formula/eeroctl.rb << 'FORMULA_EOF'
            license "MIT"
            head "https://github.com/fulviofreitas/eeroctl.git", branch: "master"

            depends_on "python@3.12"

            def install
              # Create virtualenv only - package installation happens in post_install
              # to bypass Homebrew's dylib ID rewriting which fails on pydantic_core
              virtualenv_create(libexec, "python3.12")

              # Create wrapper scripts that delegate to the actual binaries
              # These will work after post_install runs
              (bin/"eero").write <<~EOS
                #!/bin/bash
                exec "#{libexec}/bin/eero" "$@"
              EOS
              (bin/"eeroctl").write <<~EOS
                #!/bin/bash
                exec "#{libexec}/bin/eeroctl" "$@"
              EOS
            end

            def post_install
              # Install packages here, AFTER Homebrew's cleanup/linkage steps
              # This avoids the "Failed changing dylib ID" error for pydantic_core
              system libexec/"bin/python", "-m", "pip", "install",
                     "--quiet", "--disable-pip-version-check",
                     "eeroctl==#{version}"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/eero --version")
              assert_match "Usage:", shell_output("#{bin}/eero --help")
            end
          end
          FORMULA_EOF

          sed -i 's/^          //' Formula/eeroctl.rb

          echo ""
          echo "📄 Generated formula:"
          cat Formula/eeroctl.rb
          echo ""
          echo "✅ Formula built"

      - name: 🔍 Validate syntax
        run: |
          echo "🔍 Checking Ruby syntax..."
          ruby -c Formula/eeroctl.rb
          echo "✅ Syntax check passed"

      - name: 📤 Upload formula artifact
        uses: actions/upload-artifact@v7
        with:
          name: formula
          path: Formula/eeroctl.rb
          retention-days: 1

  # ===========================================================================
  # Job 2: Test installation on macOS (required for release)
  # ===========================================================================
  test:
    name: 🧪 Test Installation
    needs: generate
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: 📥 Download formula artifact
        uses: actions/download-artifact@v4
        with:
          name: formula
          path: Formula

      - name: 🧪 Test installation
        env:
          VERSION: ${{ needs.generate.outputs.version }}
        run: |
          echo "🧪 Testing formula installation..."
          echo ""

          echo "🔗 Creating local tap..."
          TAP_PATH="$(brew --repository)/Library/Taps/fulviofreitas/homebrew-eeroctl"
          mkdir -p "$(dirname "$TAP_PATH")"
          ln -sf "$GITHUB_WORKSPACE" "$TAP_PATH"

          echo "🍺 Installing eeroctl from local formula..."
          brew install --build-from-source --verbose fulviofreitas/eeroctl/eeroctl

          echo ""
          echo "🧪 Running formula test block..."
          brew test eeroctl

          echo ""
          echo "✅ Verifying binary works..."
          eero --version
          eero --help | head -5

          echo ""
          echo "🎉 Installation test passed!"

          echo ""
          echo "🧹 Cleaning up..."
          brew uninstall eeroctl
          rm -f "$TAP_PATH"
          echo "✅ Cleanup complete"

      - name: 🔑 Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.RENOVATE_APP_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}

      - name: 🚀 Open formula-update PR
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: bot/update-formula-${{ needs.generate.outputs.version }}
          delete-branch: true
          commit-message: "chore: update eeroctl to ${{ needs.generate.outputs.version }}"
          title: "chore: update eeroctl to ${{ needs.generate.outputs.version }}"
          labels: automerge,dependencies
          add-paths: Formula/eeroctl.rb
          body: |
            Automated formula bump for `eeroctl ${{ needs.generate.outputs.version }}`.

            Generated by `update-formula.yml`. Macos install + `brew test` already
            ran green in this run. The `automerge` label triggers the auto-merge
            workflow to squash-merge once required checks pass.

      - name: 📊 Summary
        if: always()
        env:
          VERSION: ${{ needs.generate.outputs.version }}
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "## 🍺 Homebrew Formula Updated" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
            echo "|:---------|:------|" >> $GITHUB_STEP_SUMMARY
            echo "| 📦 Package | \`eeroctl\` |" >> $GITHUB_STEP_SUMMARY
            echo "| 🏷️ Version | \`${VERSION}\` |" >> $GITHUB_STEP_SUMMARY
            echo "| 🔍 Syntax | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
            echo "| 🧪 Installation | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
            echo "| 🚀 Status | PR opened (auto-merge) |" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### 📥 Installation" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
            echo "brew install fulviofreitas/eeroctl/eeroctl" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "## ❌ Homebrew Formula Update Failed" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
            echo "|:---------|:------|" >> $GITHUB_STEP_SUMMARY
            echo "| 📦 Package | \`eeroctl\` |" >> $GITHUB_STEP_SUMMARY
            echo "| 🏷️ Version | \`${VERSION}\` |" >> $GITHUB_STEP_SUMMARY
            echo "| 🚀 Status | ❌ Failed |" >> $GITHUB_STEP_SUMMARY
          fi
