# ============================================================================
# 🍺 Auto-Update Homebrew Formula
# ============================================================================
# Triggered by eeroctl release workflow
# Auto-commits updated formula to master branch
# ============================================================================

name: 🍺 Update Formula

on:
  repository_dispatch:
    types: [update-formula]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to update to"
        required: true

permissions:
  contents: write

# Prevent concurrent runs from conflicting
concurrency:
  group: formula-update
  cancel-in-progress: false

jobs:
  # ===========================================================================
  # Job 1: Generate formula on fast Ubuntu runner
  # ===========================================================================
  generate:
    name: 📝 Generate Formula
    runs-on: ubuntu-latest
    timeout-minutes: 15

    outputs:
      version: ${{ steps.meta.outputs.version }}
      sha256: ${{ steps.meta.outputs.sha256 }}
      source_url: ${{ steps.meta.outputs.source_url }}

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v6

      - name: 🐍 Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: ⏳ Wait for PyPI availability
        env:
          VERSION: ${{ github.event.client_payload.version || github.event.inputs.version }}
        run: |
          echo "🔍 Waiting for eeroctl ${VERSION} to be available on PyPI..."

          for i in {1..30}; do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "https://pypi.org/pypi/eeroctl/${VERSION}/json")
            if [ "$HTTP_CODE" = "200" ]; then
              echo "✅ Package available on PyPI"
              break
            fi
            echo "⏳ Attempt $i: HTTP $HTTP_CODE - waiting 10s..."
            sleep 10
          done

          if [ "$HTTP_CODE" != "200" ]; then
            echo "❌ Package not available after 5 minutes"
            exit 1
          fi

      - name: 📋 Get package metadata
        id: meta
        env:
          VERSION: ${{ github.event.client_payload.version || github.event.inputs.version }}
        run: |
          echo "🔍 Fetching metadata from PyPI..."
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

          PYPI_JSON=$(curl -s "https://pypi.org/pypi/eeroctl/${VERSION}/json")

          SHA256=$(echo "$PYPI_JSON" | python3 -c "import sys, json; data = json.load(sys.stdin); print(next(u['digests']['sha256'] for u in data['urls'] if u['packagetype'] == 'sdist'))")
          echo "sha256=${SHA256}" >> $GITHUB_OUTPUT

          SOURCE_URL=$(echo "$PYPI_JSON" | python3 -c "import sys, json; data = json.load(sys.stdin); print(next(u['url'] for u in data['urls'] if u['packagetype'] == 'sdist'))")
          echo "source_url=${SOURCE_URL}" >> $GITHUB_OUTPUT

          echo ""
          echo "📦 Package: eeroctl"
          echo "🏷️  Version: ${VERSION}"
          echo "🔗 URL: ${SOURCE_URL}"
          echo "🔐 SHA256: ${SHA256}"

      - name: 🏗️ Build formula
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          SHA256: ${{ steps.meta.outputs.sha256 }}
          SOURCE_URL: ${{ steps.meta.outputs.source_url }}
        run: |
          echo "🏗️ Building Formula/eeroctl.rb..."

          # Generate formula that uses pip with binary wheels (FAST installation)
          # This avoids compiling from source and eliminates need for rust/llvm
          cat > Formula/eeroctl.rb << EOF
          class Eeroctl < Formula
            include Language::Python::Virtualenv

            desc "Command-line interface for managing Eero mesh Wi-Fi networks"
            homepage "https://github.com/fulviofreitas/eeroctl"
            url "${SOURCE_URL}"
            sha256 "${SHA256}"
            license "MIT"
            head "https://github.com/fulviofreitas/eeroctl.git", branch: "master"

            depends_on "python@3.12"

            def install
              # Create virtualenv
              venv = virtualenv_create(libexec, "python3.12")

              # Use pip directly to install with dependencies and binary wheels
              # Homebrew's venv.pip_install adds --no-deps which skips dependencies
              # We need dependencies (click, rich, etc.) so we call pip directly
              system libexec/"bin/pip", "install", "eeroctl==#{version}"

              bin.install_symlink libexec/"bin/eero"
              bin.install_symlink libexec/"bin/eeroctl"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/eero --version")
              assert_match "Usage:", shell_output("#{bin}/eero --help")
            end
          end
          EOF

          sed -i 's/^          //' Formula/eeroctl.rb

          echo ""
          echo "📄 Generated formula:"
          cat Formula/eeroctl.rb
          echo ""
          echo "✅ Formula built"

      - name: 🔍 Validate syntax
        run: |
          echo "🔍 Checking Ruby syntax..."
          ruby -c Formula/eeroctl.rb
          echo "✅ Syntax check passed"

      - name: 📤 Upload formula artifact
        uses: actions/upload-artifact@v4
        with:
          name: formula
          path: Formula/eeroctl.rb
          retention-days: 1

  # ===========================================================================
  # Job 2: Test installation on macOS (required for release)
  # ===========================================================================
  test:
    name: 🧪 Test Installation
    needs: generate
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v6

      - name: 📥 Download formula artifact
        uses: actions/download-artifact@v4
        with:
          name: formula
          path: Formula

      - name: 🧪 Test installation
        env:
          VERSION: ${{ needs.generate.outputs.version }}
        run: |
          echo "🧪 Testing formula installation..."
          echo ""

          echo "🔗 Creating local tap..."
          TAP_PATH="$(brew --repository)/Library/Taps/fulviofreitas/homebrew-eeroctl"
          mkdir -p "$(dirname "$TAP_PATH")"
          ln -sf "$GITHUB_WORKSPACE" "$TAP_PATH"

          echo "🍺 Installing eeroctl from local formula..."
          brew install --build-from-source --verbose fulviofreitas/eeroctl/eeroctl

          echo ""
          echo "🧪 Running formula test block..."
          brew test eeroctl

          echo ""
          echo "✅ Verifying binary works..."
          eero --version
          eero --help | head -5

          echo ""
          echo "🎉 Installation test passed!"

          echo ""
          echo "🧹 Cleaning up..."
          brew uninstall eeroctl
          rm -f "$TAP_PATH"
          echo "✅ Cleanup complete"

      - name: 🚀 Commit and push
        env:
          VERSION: ${{ needs.generate.outputs.version }}
        run: |
          echo "🚀 Committing and pushing changes..."

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Check if there are actual changes
          if git diff --quiet Formula/eeroctl.rb; then
            echo "⚠️ No changes to formula - skipping commit"
            exit 0
          fi

          # Commit locally first (git pull --rebase requires clean working tree)
          git add Formula/eeroctl.rb
          git commit -m "chore: update eeroctl to ${VERSION}"

          # Rebase our commit on top of any remote changes
          git pull --rebase origin master

          git push origin master

          echo "✅ Formula committed and pushed"

      - name: 📊 Summary
        if: always()
        env:
          VERSION: ${{ needs.generate.outputs.version }}
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "## 🍺 Homebrew Formula Updated" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
            echo "|:---------|:------|" >> $GITHUB_STEP_SUMMARY
            echo "| 📦 Package | \`eeroctl\` |" >> $GITHUB_STEP_SUMMARY
            echo "| 🏷️ Version | \`${VERSION}\` |" >> $GITHUB_STEP_SUMMARY
            echo "| 🔍 Syntax | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
            echo "| 🧪 Installation | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
            echo "| 🚀 Status | Merged to master |" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### 📥 Installation" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
            echo "brew install fulviofreitas/eeroctl/eeroctl" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "## ❌ Homebrew Formula Update Failed" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
            echo "|:---------|:------|" >> $GITHUB_STEP_SUMMARY
            echo "| 📦 Package | \`eeroctl\` |" >> $GITHUB_STEP_SUMMARY
            echo "| 🏷️ Version | \`${VERSION}\` |" >> $GITHUB_STEP_SUMMARY
            echo "| 🚀 Status | ❌ Failed |" >> $GITHUB_STEP_SUMMARY
          fi
