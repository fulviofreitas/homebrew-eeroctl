version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    groups:
      actions-minor:
        update-types:
          - minor
          - patch
    labels:
      - dependencies
      - github-actions
      - automerge
    commit-message:
      prefix: "chore(deps)"
      include: scope
